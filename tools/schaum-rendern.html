<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Schaum-Texturen rendern</title>
  <!-- Nur für die Entwicklung (wird nicht ausgeliefert): erzeugt die Texturen für Stufe 7 der Scroll-Sequenz
       („das Bier wird leer“) prozedural mit festem Zufalls-Seed – bei jedem Lauf identisch:
         schaum.png      Schaumkrone, waagrecht kachelbar; Bieroberfläche bei 75 % der Höhe (SURFACE in js/sequenz.js)
         schaumrand.png  Schaumring am Glas, waagrecht kachelbar
         perlen.png      aufsteigende Kohlensäure-Perlen, senkrecht kachelbar
       Ablauf: über den lokalen Aufnahme-Server öffnen (POST /__shot), „Rendern“ klicken,
       danach python3 tools/sequenz.py <roh-ordner> → assets/sequenz/schaum.webp, schaumrand.webp, perlen.webp -->
  <style>
    body { font: 15px system-ui; padding: 20px; background: #F7F4EC; }
    canvas { display: block; margin: 12px 0; width: 100%; height: auto; background: linear-gradient(#F7F4EC 50%, #a57b2c 50%); }
    #perlen { width: 256px; }
  </style>
</head>
<body>
  <p><button id="go">Rendern</button> <span id="status">bereit</span></p>
  <canvas id="schaum"></canvas>
  <canvas id="schaumrand"></canvas>
  <canvas id="perlen"></canvas>
  <script type="module">
    const status = (t) => { document.getElementById('status').textContent = t; window.__status = t; };

    // ── Hilfen ──────────────────────────────────────
    function random(seed) {                     // mulberry32: kleiner, reproduzierbarer Zufall
      return () => {
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;

    // periodisches Rauschen (t in 0…1 wiederholt sich) → Kanten passen beim Kacheln nahtlos
    function noise1D(rand, cells, octaves) {
      const layers = Array.from({ length: octaves }, (_, o) => Array.from({ length: cells << o }, () => rand() * 2 - 1));
      return (t) => {
        let sum = 0, norm = 0;
        layers.forEach((v, o) => {
          const x = (((t % 1) + 1) % 1) * v.length, i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f);
          const a = v[i % v.length], b = v[(i + 1) % v.length];
          sum += (a + (b - a) * s) / (1 << o);
          norm += 1 / (1 << o);
        });
        return sum / norm;
      };
    }

    // Punkte mit Mindestabstand streuen (Radius je Höhe variabel), waagrecht periodisch
    function scatter(rand, w, y0, y1, radiusAt, tries) {
      const G = 8, gx = w / G, gy = Math.ceil((y1 - y0) / G) + 1;
      const grid = Array.from({ length: gx * gy }, () => []);
      const pts = [];
      let rMax = 0;
      for (let y = y0; y <= y1; y++) rMax = Math.max(rMax, radiusAt(y) * 1.25);
      for (let t = 0; t < tries; t++) {
        const x = rand() * w, y = y0 + rand() * (y1 - y0), r = radiusAt(y) * (0.75 + 0.5 * rand());
        const bx = Math.floor(x / G), by = Math.floor((y - y0) / G), reach = Math.ceil((r + rMax) / G);
        let ok = true;
        for (let yy = Math.max(0, by - reach); ok && yy <= Math.min(gy - 1, by + reach); yy++) {
          for (let k = -reach; ok && k <= reach; k++) {
            for (const j of grid[yy * gx + (((bx + k) % gx) + gx) % gx]) {
              let dx = pts[j].x - x; if (dx > w / 2) dx -= w; else if (dx < -w / 2) dx += w;
              const dy = pts[j].y - y;
              if (dx * dx + dy * dy < ((r + pts[j].r) * 0.92) ** 2) { ok = false; break; }
            }
          }
        }
        if (ok) { grid[by * gx + bx].push(pts.length); pts.push({ x, y, r }); }
      }
      return pts;
    }

    // Zellen (Worley/Voronoi): nächster + zweitnächster Punkt je Pixel, waagrecht periodisch
    function cells(pts, w, h) {
      const G = 32, gx = w / G, gy = Math.ceil(h / G);
      const PX = new Float32Array(pts.map((p) => p.x)), PY = new Float32Array(pts.map((p) => p.y));
      const counts = new Int32Array(gx * gy);
      const cellOf = pts.map((p) => {
        const c = Math.min(gy - 1, Math.max(0, Math.floor(p.y / G))) * gx + Math.floor(p.x / G) % gx;
        counts[c]++;
        return c;
      });
      const start = new Int32Array(gx * gy + 1);
      for (let c = 0; c < gx * gy; c++) start[c + 1] = start[c] + counts[c];
      const fill = start.slice(0, gx * gy), idx = new Int32Array(pts.length);
      cellOf.forEach((c, i) => { idx[fill[c]++] = i; });
      const out = { d1: 0, d2: 0, i: -1 };
      return (x, y, R) => {
        const bx = Math.floor(x / G), by = Math.floor(y / G);
        let d1 = 1e9, d2 = 1e9, i1 = -1;
        for (let yy = Math.max(0, by - R); yy <= Math.min(gy - 1, by + R); yy++) {
          for (let k = -R; k <= R; k++) {
            const c = yy * gx + (((bx + k) % gx) + gx) % gx;
            for (let s = start[c]; s < start[c + 1]; s++) {
              const j = idx[s];
              let dx = PX[j] - x; if (dx > w / 2) dx -= w; else if (dx < -w / 2) dx += w;
              const dy = PY[j] - y, d = dx * dx + dy * dy;
              if (d < d1) { d2 = d1; d1 = d; i1 = j; } else if (d < d2) d2 = d;
            }
          }
        }
        out.d1 = Math.sqrt(d1); out.d2 = Math.sqrt(d2); out.i = i1;
        return out;
      };
    }
    const wrapDx = (dx, w) => (dx > w / 2 ? dx - w : dx < -w / 2 ? dx + w : dx);

    // periodisches 2D-Rauschen (waagrecht kachelbar) für großflächige Helligkeitsschwankungen
    function noise2D(rand, cx, cy, octaves) {
      const layers = Array.from({ length: octaves }, (_, o) => {
        const nx = cx << o, ny = cy << o;
        return { nx, ny, vals: Float32Array.from({ length: nx * (ny + 1) }, () => rand() * 2 - 1) };
      });
      return (u, v) => {
        let sum = 0, norm = 0;
        layers.forEach(({ nx, ny, vals }, o) => {
          const x = (((u % 1) + 1) % 1) * nx, y = clamp01(v) * ny;
          const i = Math.floor(x), j = Math.min(ny - 1, Math.floor(y)), fx = x - i, fy = y - j;
          const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
          const at = (a, b) => vals[b * nx + (a % nx)];
          sum += lerp(lerp(at(i, j), at(i + 1, j), sx), lerp(at(i, j + 1), at(i + 1, j + 1), sx), sy) / (1 << o);
          norm += 1 / (1 << o);
        });
        return sum / norm;
      };
    }

    // Licht auf einer Schaumblase an der Glaswand: Kugelkappe, Licht von oben links vorne.
    // q: 0 Blasenmitte … 1 Blasenrand · (ux, uy): Richtung vom Mittelpunkt · t: 0 feiner Schaum oben … 1 große Blasen unten
    const WHITE = [255, 254, 250], SHADOW = [232, 224, 208], BEER = [232, 190, 110];
    function shadeBubble(q, ux, uy, t, out) {
      const nx = ux * q, ny = uy * q, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      const diff = clamp01(-0.36 * nx - 0.55 * ny + 0.75 * nz);
      const spec = Math.pow(clamp01(-0.22 * nx - 0.42 * ny + 0.88 * nz), 30) * (0.15 + 0.75 * t);
      const see = 0.3 * t * t * t * (1 - q * q);              // große Blasen ganz unten: das Bier scheint durch
      const rim = smooth(0.75, 1, q) * (0.08 + 0.18 * t);     // Blasenrand etwas dunkler
      for (let k = 0; k < 3; k++) {
        let c = lerp(SHADOW[k], WHITE[k], 0.5 + 0.5 * diff);
        c = lerp(c, BEER[k], see);
        c = lerp(c, SHADOW[k] * 0.9, rim);
        out[k] = c + (255 - c) * spec;
      }
      return out;
    }

    // einzelnes Bläschen mit feinem Rand und Glanzpunkt (Perlen, Bläschen im Bier)
    function bubble(g, x, y, r, alpha = 1) {
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
      g.fillStyle = `rgba(255, 249, 230, ${0.42 * alpha})`; g.fill();
      g.lineWidth = Math.max(0.6, r * 0.28);
      g.strokeStyle = `rgba(118, 76, 18, ${0.38 * alpha})`; g.stroke();
      g.beginPath(); g.arc(x - r * 0.33, y - r * 0.36, r * 0.34, 0, Math.PI * 2);
      g.fillStyle = `rgba(255, 255, 255, ${0.95 * alpha})`; g.fill();
    }

    function setup(id, w, h) {
      const cv = document.getElementById(id);
      cv.width = w; cv.height = h;
      return cv.getContext('2d');
    }

    // ── 1. Schaumkrone ──────────────────────────────
    function renderFoam() {
      const W = 2048, H = 512, TOP = 56, SURF = Math.round(H * 0.75);   // Bieroberfläche bei 75 % (SURFACE in js/sequenz.js)
      const rand = random(5306);
      const edgeN = noise1D(rand, 5, 4), surfN = noise1D(rand, 11, 3), tone = noise2D(rand, 6, 2, 3);
      const yTop = (x) => TOP + 14 * edgeN(x / W);                        // unregelmäßige Oberkante
      const ySurf = (x) => SURF + 4 * surfN(x / W);                        // Übergang Schaum → Bier
      const depth = (y) => clamp01((y - TOP) / (SURF - TOP));
      const radiusAt = (y) => 2.4 + 9.5 * Math.pow(depth(y), 1.9);         // oben feiner, trockener Schaum, unten große nasse Blasen
      const pts = scatter(rand, W, TOP - 20, SURF + 10, radiusAt, 420000);
      const near = cells(pts, W, H);

      const g = setup('schaum', W, H);
      const img = g.createImageData(W, H), px = img.data, col = [0, 0, 0];
      const OUTLINE = [196, 178, 140];   // Umriss der Schaumkrone → hebt sich vom beigen Hintergrund ab
      const HAZE = [252, 230, 170];      // heller, perlender Saum im Bier direkt unter dem Schaum
      for (let y = 0; y < H; y++) {
        const R = radiusAt(y) > 7 ? 2 : 1, inFoam = y > TOP - 40 && y < SURF + 18;
        for (let x = 0; x < W; x++) {
          const yt = yTop(x), ys = ySurf(x), o = (y * W + x) * 4;
          let a = 0;
          const hit = inFoam ? near(x + 0.5, y + 0.5, R) : null;
          if (hit && hit.i >= 0) {
            const { d1, d2 } = hit, p = pts[hit.i], ypt = yTop(p.x);
            // oben: Kante + angesetzte Blasen-Kuppeln · unten: Oberfläche + Blasen, die leicht ins Bier hängen (>0 = innen)
            const inTop = Math.max(y - yt, p.y > ypt - 0.4 * p.r && p.y < ypt + 1.2 * p.r ? p.r * 0.95 - d1 : -1e9);
            const inBot = Math.max(ys - y, p.y < ys ? p.r * 0.9 - d1 : -1e9);
            a = smooth(-0.7, 0.7, inTop) * smooth(-0.7, 0.7, inBot);
            if (a > 0) {
              const t = depth(y);
              const b = (d2 - d1) / 2, filmW = 0.3 + 1.0 * t;               // Abstand zur Zellgrenze, Flüssigkeitsfilm-Breite
              const bub = smooth(filmW - 0.6, filmW + 0.6, b);
              const q = clamp01(d1 / Math.max(0.5, d1 + b - filmW));
              let ux = 0, uy = 0;
              if (d1 > 1e-3) { ux = wrapDx(x + 0.5 - p.x, W) / d1; uy = (y + 0.5 - p.y) / d1; }
              shadeBubble(q, ux, uy, t, col);
              const tf = t * t, film = [lerp(236, 216, tf), lerp(228, 182, tf), lerp(212, 116, tf)];   // oben hell, unten goldener
              const edge = 1 - smooth(0.5, 2.6, Math.min(inTop, inBot));
              const lum = 1 + 0.02 * tone(x / W, y / H);
              for (let k = 0; k < 3; k++) {
                const c = lerp(lerp(film[k], col[k], bub), OUTLINE[k], edge * 0.55);
                px[o + k] = Math.min(255, c * lum);
              }
            }
          }
          const h = y > ys - 2 ? 0.7 * Math.exp(-(y - ys) / 80) * (1 - smooth(H - 60, H - 2, y)) * (1 - a) : 0;
          const oa = a + h;
          if (oa <= 0) { px[o + 3] = 0; continue; }
          for (let k = 0; k < 3; k++) px[o + k] = (px[o + k] * a + HAZE[k] * h) / oa;
          px[o + 3] = Math.round(oa * 255);
        }
      }
      g.putImageData(img, 0, 0);

      // kleine Bläschen im Bier direkt unter dem Schaum (dichter nahe der Oberfläche)
      for (let n = 0; n < 1100; n++) {
        const x = rand() * W, y = SURF + 5 + -Math.log(1 - rand() * 0.98) * 26, r = 1.4 + rand() * 2.2;
        if (y > H - 6) continue;
        for (const ox of [-W, 0, W]) if (x + ox > -6 && x + ox < W + 6) bubble(g, x + ox, y, r, 0.95 - 0.7 * clamp01((y - SURF) / (H - SURF)));
      }
    }

    // ── 2. Schaumrand am Glas ───────────────────────
    function renderRing() {
      const W = 2048, H = 256, rand = random(771);
      const lineN = noise1D(rand, 9, 3), thickN = noise1D(rand, 14, 3);
      const yc = (x) => 44 + 6 * lineN(x / W);
      const thick = (x) => Math.max(0, 6 + 26 * thickN(x / W));      // mit Lücken, nicht durchgehend
      // „Vorhänge“: Schaumspuren, die vom Ring nach unten laufen, dazu einzelne Inseln
      const drips = Array.from({ length: 18 }, () => ({ x: rand() * W, w: 4 + rand() * 6, len: 16 + rand() * 60, ph: rand() * 6 }));
      const blobs = Array.from({ length: 50 }, () => ({ x: rand() * W, y: 50 + Math.pow(rand(), 1.6) * 70, r: 2 + rand() * 5 }));
      const pts = scatter(rand, W, 0, H, () => 3, 300000);
      const near = cells(pts, W, H);
      const holes = pts.map(() => rand() < 0.3);                           // einzelne Blasen fehlen → spitzenartig

      const g = setup('schaumrand', W, H);
      const img = g.createImageData(W, H), px = img.data, col = [0, 0, 0];
      const FILM = [205, 192, 168], EDGE = [178, 162, 132];
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const c = yc(x), th = thick(x), o = (y * W + x) * 4;
          let m = th > 1 ? smooth(th / 2 + 1, th / 2 - 1, Math.abs(y - c)) : 0;
          for (const d of drips) {
            const dx = wrapDx(x - d.x, W), dd = y - c;
            if (dd < 0 || dd > d.len) continue;
            const half = (d.w / 2) * Math.pow(1 - dd / d.len, 0.7), wob = Math.sin(dd / 9 + d.ph) * 1.4;
            m = Math.max(m, smooth(half + 1, half - 1, Math.abs(dx - wob)));
          }
          for (const bl of blobs) {
            const dx = wrapDx(x - bl.x, W), dy = y - bl.y;
            if (Math.abs(dx) < bl.r + 2 && Math.abs(dy) < bl.r + 2) m = Math.max(m, smooth(bl.r + 1, bl.r - 1, Math.hypot(dx, dy)) * 0.9);
          }
          if (m <= 0) { px[o + 3] = 0; continue; }
          const { d1, d2, i } = near(x + 0.5, y + 0.5, 1), p = pts[i];
          if (holes[i]) m *= 0.1;
          const b = (d2 - d1) / 2, bub = smooth(0.2, 1.0, b);
          const q = clamp01(d1 / Math.max(0.5, d1 + b - 0.6));
          let ux = 0, uy = 0;
          if (d1 > 1e-3) { ux = wrapDx(x + 0.5 - p.x, W) / d1; uy = (y + 0.5 - p.y) / d1; }
          shadeBubble(q, ux, uy, 0.05, col);
          const edge = 1 - smooth(0.25, 0.9, m);                             // Rand der Spur etwas dunkler → auf Beige sichtbar
          for (let k = 0; k < 3; k++) px[o + k] = lerp(lerp(FILM[k], col[k], bub), EDGE[k], edge * 0.55);
          px[o + 3] = Math.round(m * 242);
        }
      }
      g.putImageData(img, 0, 0);
    }

    // ── 3. Kohlensäure-Perlen ───────────────────────
    function renderBubbles() {
      const W = 1024, H = 1024, rand = random(1412);
      const g = setup('perlen', W, H);
      const put = (x, y, r, a) => {
        for (const oy of [-H, 0, H]) for (const ox of [-W, 0, W]) {
          const X = x + ox, Y = y + oy;
          if (X > -10 && X < W + 10 && Y > -10 && Y < H + 10) bubble(g, X, Y, r, a);
        }
      };
      for (let s = 0; s < 11; s++) {                                    // Perlenketten von Keimstellen, unregelmäßig verteilt
        const x0 = rand() * W, gap = 22 + rand() * 34, ph = rand() * 6, r0 = 1.6 + rand() * 1.2;
        const env = rand() * 6, envF = 1 + Math.floor(rand() * 3);      // Kette mal dicht, mal Pause (periodisch → kachelbar)
        for (let y = rand() * gap; y < H; y += gap * (0.7 + 0.6 * rand())) {
          const strength = 0.35 + 0.65 * Math.max(0, Math.sin((y / H) * Math.PI * 2 * envF + env));
          if (strength < 0.4) continue;
          put(x0 + Math.sin(y / 50 + ph) * 2.2, y, r0 + rand() * 1.8, strength);
        }
      }
      for (let n = 0; n < 120; n++) put(rand() * W, rand() * H, 1.3 + rand() * 2.4, 0.45 + rand() * 0.45);   // einzelne Bläschen
    }

    async function upload(id) {
      const blob = await new Promise((resolve) => document.getElementById(id).toBlob(resolve, 'image/png'));
      const res = await fetch(`/__shot?dir=sequenz-roh&name=${id}`, { method: 'POST', body: blob });
      if (!res.ok) throw new Error('Upload fehlgeschlagen: ' + res.status);
    }

    window.__render = async () => {
      status('Schaum …'); await new Promise((r) => setTimeout(r, 20)); renderFoam(); await upload('schaum');
      status('Schaumrand …'); await new Promise((r) => setTimeout(r, 20)); renderRing(); await upload('schaumrand');
      status('Perlen …'); renderBubbles(); await upload('perlen');
      status('fertig');
    };
    document.getElementById('go').addEventListener('click', () => window.__render());
    status('bereit');
  </script>
</body>
</html>
