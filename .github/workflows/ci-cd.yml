# CI: prüft jede Änderung (Push und Pull Request).
# CD: veröffentlicht main nach bestandener Prüfung auf GitHub Pages (berghof-hell.de)
#     und kontrolliert danach, ob die Live-Seite erreichbar ist.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Website prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Links, Drittanbieter (DSGVO), JSON-LD, Sitemap, JavaScript
        run: python3 .github/scripts/check-site.py

  deploy:
    name: Veröffentlichen
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://berghof-hell.de/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Website zusammenstellen (ohne Werkzeuge, Quelldaten und Render-Dateien)
        # Nur für das lokale Rendern der Bildsequenz (tools/sequenz-rendern.html) gebraucht, Besucher laden sie nie:
        # 3D-Modell (js/scene.js, bottle.js, stage.js, config.js, textures.js), vendor/three, vendor/lenis, assets/textures
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git*' --exclude '.github' --exclude '.claude' --exclude '.DS_Store' \
            --exclude 'tools' --exclude 'data' --exclude 'README.md' --exclude '_site' \
            --exclude '/js/scene.js' --exclude '/js/bottle.js' --exclude '/js/stage.js' \
            --exclude '/js/config.js' --exclude '/js/textures.js' \
            --exclude '/vendor/three' --exclude '/vendor/lenis.min.js' --exclude '/assets/textures' \
            --exclude '*.heic' --exclude '/*.png' \
            ./ _site/
      - name: Zusammengestellte Website prüfen (fehlt durch das Weglassen etwas?)
        run: python3 .github/scripts/check-site.py _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # sonst fehlen .well-known/security.txt und .nojekyll
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Live-Seite prüfen
        run: |
          for page in "" impressum.html datenschutz.html .well-known/security.txt; do
            url="https://berghof-hell.de/$page"
            for try in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url") && [ "$code" = 200 ] && break
              echo "$url → $code, neuer Versuch in 10 s"; sleep 10
            done
            [ "$code" = 200 ] || { echo "::error::$url antwortet mit $code"; exit 1; }
            echo "$url → 200"
          done
